server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21m;

    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location ^~ /api/extract/preview {
        include /run/preview-secret/nginx.conf;
        proxy_pass http://app:8000;
        proxy_read_timeout 240s;
    }

    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 240s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # PDF.js ships its worker as an ES module; Nginx's default MIME map may
    # otherwise serve .mjs as application/octet-stream, which browsers reject.
    location ~ ^/assets/.*\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
