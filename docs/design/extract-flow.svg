<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 132" role="img" aria-label="Extract flow"><style>text{font-family:"Segoe UI",Arial,sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c56c9"/></marker></defs>
  <g font-size="10" text-anchor="middle">
    <rect x="0" y="6" width="108" height="62" rx="6" fill="#fff" stroke="#17202e"/>
    <text x="54" y="25" font-weight="700">1 Check the file</text>
    <text x="54" y="41" font-size="8.5" fill="#5b6577">really a PDF? size,</text>
    <text x="54" y="53" font-size="8.5" fill="#5b6577">pages, password</text>
    <rect x="122" y="6" width="108" height="62" rx="6" fill="#fff" stroke="#17202e"/>
    <text x="176" y="25" font-weight="700">2 Page → image</text>
    <text x="176" y="41" font-size="8.5" fill="#5b6577">every page, starting</text>
    <text x="176" y="53" font-size="8.5" fill="#5b6577">at page 0, 300 DPI</text>
    <rect x="244" y="6" width="108" height="62" rx="6" fill="#fff" stroke="#17202e"/>
    <text x="298" y="25" font-weight="700">3 Read the words</text>
    <text x="298" y="41" font-size="8.5" fill="#5b6577">OCR gives each word</text>
    <text x="298" y="53" font-size="8.5" fill="#5b6577">and where it sits</text>
    <rect x="366" y="6" width="108" height="62" rx="6" fill="#e8eefc" stroke="#2c56c9"/>
    <text x="420" y="25" font-weight="700">4 Pixels → points</text>
    <text x="420" y="41" font-size="8.5" fill="#5b6577">pt = px × 72 / 300,</text>
    <text x="420" y="53" font-size="8.5" fill="#5b6577">done once</text>
    <rect x="488" y="6" width="108" height="62" rx="6" fill="#e8eefc" stroke="#2c56c9"/>
    <text x="542" y="25" font-weight="700">5 Find the people</text>
    <text x="542" y="41" font-size="8.5" fill="#5b6577">their own words</text>
    <text x="542" y="53" font-size="8.5" fill="#5b6577">give the box</text>
    <rect x="610" y="6" width="108" height="62" rx="6" fill="#fff" stroke="#17202e"/>
    <text x="664" y="25" font-weight="700">6 Compare</text>
    <text x="664" y="41" font-size="8.5" fill="#5b6577">with your list: case,</text>
    <text x="664" y="53" font-size="8.5" fill="#5b6577">accents, OCR typos</text>
  </g>
  <g stroke="#2c56c9" stroke-width="1.5">
    <line x1="108" y1="37" x2="120" y2="37" marker-end="url(#e1)"/><line x1="230" y1="37" x2="242" y2="37" marker-end="url(#e1)"/>
    <line x1="352" y1="37" x2="364" y2="37" marker-end="url(#e1)"/><line x1="474" y1="37" x2="486" y2="37" marker-end="url(#e1)"/>
    <line x1="596" y1="37" x2="608" y2="37" marker-end="url(#e1)"/>
  </g>
  <rect x="0" y="82" width="718" height="46" rx="6" fill="#f3f5f9"/>
  <g font-size="9">
    <text x="12" y="100" font-weight="700">Real result on company_memo.pdf</text>
    <text x="12" y="118">"Robert Chen" → page 0, x 59.76, y 266.88, width 53.04, height 7.2 (PDF points, top-left origin) → matches "Robert Chen", score 1.0</text>
  </g>
</svg>
