<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" role="img" aria-label="How the pieces fit together"><style>text{font-family:"Segoe UI",Arial,sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/></marker></defs>
  <g font-size="9" font-weight="700" fill="#5b6577" letter-spacing="1">
    <text x="10" y="12">WHO USES IT</text><text x="170" y="12">ENTRY POINT</text>
    <text x="336" y="12">WHAT IT DOES</text><text x="530" y="12">ENGINES IT USES</text>
  </g>
  <g font-size="10" text-anchor="middle">
    <rect x="10" y="30" width="130" height="62" rx="6" fill="#e8eefc" stroke="#2c56c9"/>
    <text x="75" y="54" font-weight="700">Compliance reviewer</text>
    <text x="75" y="70" font-size="9" fill="#5b6577">audit viewer in the</text>
    <text x="75" y="82" font-size="9" fill="#5b6577">browser: PDF + boxes</text>
    <rect x="10" y="130" width="130" height="62" rx="6" fill="#e8eefc" stroke="#2c56c9"/>
    <text x="75" y="156" font-weight="700">Other systems</text>
    <text x="75" y="172" font-size="9" fill="#5b6577">call the HTTP API</text>

    <rect x="170" y="30" width="136" height="162" rx="6" fill="#fff" stroke="#17202e"/>
    <text x="238" y="54" font-weight="700">API (FastAPI)</text>
    <text x="238" y="76" font-size="9">/api/extract</text>
    <text x="238" y="90" font-size="9">/api/ingest</text>
    <text x="238" y="104" font-size="9">/api/ask</text>
    <text x="238" y="118" font-size="9">/health</text>
    <text x="238" y="146" font-size="9" fill="#5b6577">checks every upload</text>
    <text x="238" y="158" font-size="9" fill="#5b6577">before doing any work</text>
    <text x="238" y="176" font-size="9" fill="#5b6577">clear errors + request id</text>

    <rect x="336" y="30" width="164" height="48" rx="6" fill="#e4f4ea" stroke="#1b7a43"/>
    <text x="418" y="50" font-weight="700">Extract names</text>
    <text x="418" y="66" font-size="9" fill="#5b6577">read → find people → box → match</text>
    <rect x="336" y="88" width="164" height="48" rx="6" fill="#e4f4ea" stroke="#1b7a43"/>
    <text x="418" y="108" font-weight="700">Index a document</text>
    <text x="418" y="124" font-size="9" fill="#5b6577">read → split into chunks → store</text>
    <rect x="336" y="146" width="164" height="48" rx="6" fill="#e4f4ea" stroke="#1b7a43"/>
    <text x="418" y="166" font-weight="700">Answer a question</text>
    <text x="418" y="182" font-size="9" fill="#5b6577">search → rank → LLM → sources</text>
  </g>
  <g font-size="9.5">
    <rect x="530" y="22" width="185" height="22" rx="4" fill="#f3f5f9" stroke="#d9dee7"/><text x="540" y="37"><tspan font-weight="700">PDF → images</tspan> · PyMuPDF</text>
    <rect x="530" y="49" width="185" height="22" rx="4" fill="#f3f5f9" stroke="#d9dee7"/><text x="540" y="64"><tspan font-weight="700">Read text (OCR)</tspan> · Tesseract</text>
    <rect x="530" y="76" width="185" height="22" rx="4" fill="#f3f5f9" stroke="#d9dee7"/><text x="540" y="91"><tspan font-weight="700">Find people</tspan> · spaCy</text>
    <rect x="530" y="103" width="185" height="22" rx="4" fill="#f3f5f9" stroke="#d9dee7"/><text x="540" y="118"><tspan font-weight="700">Meaning vectors</tspan> · e5</text>
    <rect x="530" y="130" width="185" height="22" rx="4" fill="#f3f5f9" stroke="#d9dee7"/><text x="540" y="145"><tspan font-weight="700">Vector store</tspan> · Chroma</text>
    <rect x="530" y="157" width="185" height="22" rx="4" fill="#f3f5f9" stroke="#d9dee7"/><text x="540" y="172"><tspan font-weight="700">Re-ranking</tspan> · cross-encoder</text>
    <rect x="530" y="184" width="185" height="22" rx="4" fill="#f3f5f9" stroke="#d9dee7"/><text x="540" y="199"><tspan font-weight="700">Write the answer</tspan> · LLM (Groq)</text>
  </g>
  <g stroke="#5b6577">
    <line x1="140" y1="61" x2="168" y2="80" marker-end="url(#c1)"/>
    <line x1="140" y1="161" x2="168" y2="142" marker-end="url(#c1)"/>
    <line x1="306" y1="54" x2="334" y2="54" marker-end="url(#c1)"/>
    <line x1="306" y1="112" x2="334" y2="112" marker-end="url(#c1)"/>
    <line x1="306" y1="170" x2="334" y2="170" marker-end="url(#c1)"/>
    <line x1="500" y1="112" x2="526" y2="112" marker-end="url(#c1)"/>
  </g>
  <text x="10" y="220" font-size="8.8" fill="#5b6577">Each engine sits behind its own small interface: it can be swapped through configuration, or replaced by a fake in tests.</text>
</svg>
