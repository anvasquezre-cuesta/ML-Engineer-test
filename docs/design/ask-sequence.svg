<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 206" role="img" aria-label="Answering a question"><style>text{font-family:"Segoe UI",Arial,sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#17202e"/></marker></defs>
  <g font-size="9.5" font-weight="700" text-anchor="middle">
    <rect x="10" y="4" width="84" height="24" rx="5" fill="#e8eefc" stroke="#2c56c9"/><text x="52" y="20">Client</text>
    <rect x="128" y="4" width="110" height="24" rx="5" fill="#fff" stroke="#17202e"/><text x="183" y="20">Service</text>
    <rect x="276" y="4" width="110" height="24" rx="5" fill="#fff" stroke="#17202e"/><text x="331" y="20">Search</text>
    <rect x="424" y="4" width="110" height="24" rx="5" fill="#fff" stroke="#17202e"/><text x="479" y="20">Re-ranker</text>
    <rect x="572" y="4" width="138" height="24" rx="5" fill="#fff" stroke="#17202e"/><text x="641" y="20">LLM</text>
  </g>
  <g stroke="#c4cad6" stroke-dasharray="3 3">
    <line x1="52" y1="28" x2="52" y2="200"/><line x1="183" y1="28" x2="183" y2="200"/>
    <line x1="331" y1="28" x2="331" y2="200"/><line x1="479" y1="28" x2="479" y2="200"/><line x1="641" y1="28" x2="641" y2="200"/>
  </g>
  <g stroke="#17202e">
    <line x1="52" y1="46" x2="181" y2="46" marker-end="url(#s1)"/>
    <line x1="183" y1="68" x2="329" y2="68" marker-end="url(#s1)"/>
    <line x1="329" y1="88" x2="185" y2="88" marker-end="url(#s1)" stroke-dasharray="4 2"/>
    <line x1="183" y1="108" x2="477" y2="108" marker-end="url(#s1)"/>
    <line x1="477" y1="128" x2="185" y2="128" marker-end="url(#s1)" stroke-dasharray="4 2"/>
    <line x1="183" y1="150" x2="639" y2="150" marker-end="url(#s1)"/>
    <line x1="639" y1="170" x2="185" y2="170" marker-end="url(#s1)" stroke-dasharray="4 2"/>
    <line x1="181" y1="192" x2="54" y2="192" marker-end="url(#s1)" stroke-dasharray="4 2"/>
  </g>
  <g font-size="8.8" fill="#17202e">
    <text x="58" y="42">question</text>
    <text x="190" y="64">find chunks by meaning and by exact words</text>
    <text x="190" y="84">up to 20 candidates</text>
    <text x="190" y="104">score each one against the question</text>
    <text x="190" y="124">the best 5, best first</text>
    <text x="190" y="146">5 numbered passages: "answer only from these, or say it isn't there"</text>
    <text x="190" y="166">answer citing [1], [3]… — or "not in the documents"</text>
    <text x="58" y="188"><tspan font-weight="700" fill="#1b7a43">answer + sources</tspan> ("file, page n"), built by the service from the citations</text>
  </g>
</svg>
