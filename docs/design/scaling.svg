<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196" role="img" aria-label="Scaling with Temporal: API, Temporal, task queues with workers, storage"><style>text{font-family:"Segoe UI",Arial,sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/>
    <defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#17202e"/></marker></defs>
    <g font-size="9.5" text-anchor="middle">
      <rect x="0" y="75" width="78" height="50" rx="6" fill="#e8eefc" stroke="#2c56c9"/>
      <text x="39" y="96" font-weight="700">Client</text><text x="39" y="111" font-size="8.5" fill="#5b6577">upload · ask</text>
      <rect x="96" y="75" width="100" height="50" rx="6" fill="#fff" stroke="#17202e"/>
      <text x="146" y="96" font-weight="700">API</text><text x="146" y="111" font-size="8.5" fill="#5b6577">202 + job id</text>
      <rect x="214" y="8" width="136" height="40" rx="6" fill="#fff" stroke="#17202e"/>
      <text x="282" y="25" font-weight="700">Object storage</text><text x="282" y="39" font-size="8.5" fill="#5b6577">PDFs by fingerprint</text>
      <rect x="214" y="62" width="136" height="90" rx="6" fill="#e8eefc" stroke="#2c56c9"/>
      <text x="282" y="82" font-weight="700" fill="#2c56c9">Temporal</text>
      <text x="282" y="98" font-size="8.5" fill="#5b6577">one workflow per PDF</text>
      <text x="282" y="111" font-size="8.5" fill="#5b6577">remembers each finished step</text>
      <text x="282" y="124" font-size="8.5" fill="#5b6577">time limits · automatic retries</text>
      <text x="282" y="137" font-size="8.5" fill="#5b6577">id = file fingerprint</text>
      <rect x="384" y="14" width="164" height="50" rx="6" fill="#e4f4ea" stroke="#1b7a43"/>
      <rect x="381" y="11" width="164" height="50" rx="6" fill="#e4f4ea" stroke="#1b7a43"/>
      <rect x="378" y="8" width="164" height="50" rx="6" fill="#fff" stroke="#1b7a43"/>
      <text x="460" y="28" font-weight="700" fill="#1b7a43">ocr queue → CPU workers × N</text>
      <text x="460" y="43" font-size="8.5" fill="#5b6577">one PDF each · read + find names</text>
      <rect x="384" y="80" width="164" height="50" rx="6" fill="#e4f4ea" stroke="#1b7a43"/>
      <rect x="381" y="77" width="164" height="50" rx="6" fill="#e4f4ea" stroke="#1b7a43"/>
      <rect x="378" y="74" width="164" height="50" rx="6" fill="#fff" stroke="#1b7a43"/>
      <text x="460" y="94" font-weight="700" fill="#1b7a43">models queue → GPU workers</text>
      <text x="460" y="109" font-size="8.5" fill="#5b6577">embeddings · re-ranker</text>
      <rect x="378" y="140" width="164" height="50" rx="6" fill="#fff" stroke="#1b7a43"/>
      <text x="460" y="160" font-weight="700" fill="#1b7a43">llm queues → small · large</text>
      <text x="460" y="175" font-size="8.5" fill="#5b6577">each capped at its provider's limit</text>
      <rect x="576" y="8" width="144" height="50" rx="6" fill="#fff" stroke="#17202e"/>
      <text x="648" y="28" font-weight="700">Results DB</text><text x="648" y="43" font-size="8.5" fill="#5b6577">names + boxes per job</text>
      <rect x="576" y="74" width="144" height="50" rx="6" fill="#fff" stroke="#17202e"/>
      <text x="648" y="94" font-weight="700">Vector DB · Qdrant</text><text x="648" y="109" font-size="8.5" fill="#5b6577">meaning + keywords built in</text>
    </g>
    <g stroke="#17202e">
      <line x1="78" y1="100" x2="94" y2="100" marker-end="url(#a4)"/>
      <line x1="170" y1="75" x2="212" y2="36" marker-end="url(#a4)"/>
      <line x1="196" y1="107" x2="212" y2="107" marker-end="url(#a4)"/>
      <line x1="350" y1="88" x2="376" y2="35" marker-end="url(#a4)"/>
      <line x1="350" y1="104" x2="376" y2="99" marker-end="url(#a4)"/>
      <line x1="350" y1="122" x2="376" y2="163" marker-end="url(#a4)"/>
      <line x1="548" y1="36" x2="574" y2="33" marker-end="url(#a4)"/>
      <line x1="548" y1="102" x2="574" y2="99" marker-end="url(#a4)"/>
    </g>
  </svg>
