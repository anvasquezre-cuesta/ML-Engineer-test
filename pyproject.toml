[project]
name = "document-intelligence-service"
version = "0.1.0"
description = "ML Engineer take-home — document extraction + RAG service (implement from scratch)."
requires-python = ">=3.12"

# Baseline dependencies — change/pin these as you see fit (justify in DECISIONS.md).
dependencies = [
    "fastapi",
    "anyio",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    # OCR / PDF
    "pytesseract",
    "pymupdf",
    "pillow",
    # NER: the model's compatible spaCy range is 3.8.x.
    "spacy>=3.8.0,<3.9.0",
    "en-core-web-sm",
    # Fuzzy matching
    "thefuzz",
    "python-Levenshtein",
    # Embeddings + vector store
    "sentence-transformers",
    "torch",
    "qdrant-client",
    # LLM / HTTP
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Linux containers use the CPU-only PyTorch builds. Other platforms keep their
# normal PyPI distribution so local development on macOS remains supported.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
