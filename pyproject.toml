[project]
name = "document-intelligence-service"
version = "0.1.0"
description = "Names + bounding boxes from scanned PDFs, fuzzy matching, and RAG over ingested documents."
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # OCR / PDF
    "pytesseract>=0.3.10",
    "pymupdf>=1.24",
    "pillow>=10",
    # NER. The model is a pinned wheel so `uv sync` installs it too (no separate download step)
    "spacy>=3.7",
    "en-core-web-sm",
    "es-core-news-sm",
    # Fuzzy matching
    "thefuzz>=0.22",
    "python-Levenshtein>=0.25",
    # Embeddings + vector store
    "sentence-transformers>=3",
    "torch>=2.2",
    "chromadb>=0.5",
    # LLM / HTTP
    "httpx>=0.27",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.5",
]

# CPU-only torch: the default wheel drags in ~2 GB of CUDA libraries we never use.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
