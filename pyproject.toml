[project]
name = "document-intelligence-service"
version = "0.1.0"
description = "ML Engineer take-home — document extraction + RAG service (implement from scratch)."
requires-python = ">=3.12"

# Baseline dependencies — change/pin these as you see fit (justify in DECISIONS.md).
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    # OCR / PDF
    "pytesseract",
    "pymupdf",
    "pillow",
    # NER
    "spacy",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # Fuzzy matching
    "thefuzz",
    "python-Levenshtein",
    # External model APIs
    "httpx",
    "langchain-openai>=1.5.2",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.3.0",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true
