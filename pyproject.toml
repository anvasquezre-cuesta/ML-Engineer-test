[project]
name = "document-intelligence-service"
version = "0.1.0"
description = "ML Engineer take-home — document extraction + RAG service (implement from scratch)."
requires-python = ">=3.12"

# Baseline dependencies — change/pin these as you see fit (justify in DECISIONS.md).
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    # OCR / PDF
    "pytesseract",
    "pymupdf",
    "pillow",
    # NER. The model is a locked wheel (see [tool.uv.sources]), not `spacy download`:
    # that needs pip, which uv venvs do not ship, and `uv sync` would remove it anyway.
    "spacy>=3.8,<3.9",
    "en-core-web-lg",
    # Fuzzy matching (thefuzz runs on rapidfuzz; python-Levenshtein is not needed)
    "thefuzz",
    # Embeddings + vector store (Chroma is embedded/local; swap for qdrant-client if preferred)
    "sentence-transformers",
    "chromadb",
    # LLM (OpenAI-compatible: OpenAI, Ollama, vLLM, ...)
    "openai>=3.37.0",
    # Structured JSON logging
    "structlog>=26.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pytesseract.*", "thefuzz.*", "chromadb.*", "sentence_transformers.*", "pymupdf.*", "fitz.*"]
ignore_missing_imports = true

# Adapters exist to wrap partly untyped libraries (PyMuPDF); the rest of app/ stays fully strict.
[[tool.mypy.overrides]]
module = ["app.adapters.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "integration: real libraries or services (Tesseract, spaCy, models, Chroma, Ollama); each skips when its dependency is missing",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
