[project]
name = "document-intelligence-service"
version = "0.1.0"
description = "ML Engineer take-home — document extraction + RAG service (implement from scratch)."
requires-python = ">=3.12"

# Baseline dependencies — change/pin these as you see fit (justify in DECISIONS.md).
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    # OCR / PDF
    "pytesseract",
    "pymupdf",
    "pillow",
    # NER: the model wheel is pinned below in [tool.uv.sources] (no `spacy download` step)
    "spacy>=3.8,<3.9",
    "en-core-web-sm",
    # Fuzzy matching
    "rapidfuzz",
    # Embeddings + vector store (Chroma is embedded/local; swap for qdrant-client if preferred)
    "sentence-transformers",
    "torch",  # listed directly only to pin the CPU build (see [tool.uv.sources])
    "chromadb",
    # LLM / HTTP
    "httpx",
    "tenacity",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[dependency-groups]
notebooks = [
    "ipykernel",
    "matplotlib",
    "pandas",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
