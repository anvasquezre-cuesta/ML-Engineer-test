[project]
name = "document-intelligence-service"
version = "0.1.0"
description = "Name extraction with PDF-space bounding boxes, fuzzy matching and RAG over scanned PDFs."
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.0.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.101",
    "en-core-web-lg",
    "en-core-web-sm",
    "fastapi",
    "fastembed>=0.8.1",
    "httpx",
    "langchain-aws>=1.7.9",
    "langchain-core>=1.6.4",
    "langchain-openai>=1.6.5",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.15.4",
    "pillow",
    "pydantic",
    "pydantic-settings",
    "pymupdf",
    "pytesseract",
    "python-multipart",
    "qdrant-client>=1.19.1",
    "rapidfuzz>=3.14.6",
    "spacy",
    "sqlalchemy[asyncio]>=2.0.54",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.168.1",
    "import-linter>=2.15",
    "invoke>=3.0.3",
    "mypy>=2.3.1",
    "pip>=25.0",
    "pydoclint>=0.9.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "types-boto3>=1.43.101",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "N", "TID", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# Test functions are named after the behaviour they check.
"tests/**" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read configuration through app.config.Settings."
"os.environb".msg = "Read configuration through app.config.Settings."
"os.getenv".msg = "Read configuration through app.config.Settings."
"os.getenvb".msg = "Read configuration through app.config.Settings."
"os.putenv".msg = "Read configuration through app.config.Settings."
"os.unsetenv".msg = "Read configuration through app.config.Settings."

[tool.ruff.format]
quote-style = "double"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = false
# Google style documents constructor Args in __init__ and instance attributes
# under the class "Attributes:"; pydoclint only sees class-level variables.
allow-init-docstring = true
check-class-attributes = false
native-mode-noqa-location = "definition"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# PyMuPDF exposes constructors without annotations.
module = [
    "scripts.*",
    "app.adapters.pymupdf.*",
    "tests.unit.test_pymupdf_renderer",
]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# pytesseract ships no type information and has no stub package.
module = ["pytesseract"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: uses a real model, binary or local service",
    "docker: needs services from docker compose",
    "e2e: exercises HTTP through the FastAPI app",
]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "(app.main)",
    "(app.bootstrap)",
    "(app.api) | (app.worker)",
    "(app.service_layer) | (app.adapters)",
    "(app.ports)",
    "(app.domain)",
]

[[tool.importlinter.contracts]]
name = "Only the composition root imports adapters"
type = "forbidden"
source_modules = ["app.api", "app.service_layer", "app.ports", "app.domain"]
forbidden_modules = ["app.adapters"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Domain and ports import no frameworks"
type = "forbidden"
source_modules = ["app.domain", "app.ports"]
forbidden_modules = [
    "aio_pika",
    "boto3",
    "fastapi",
    "fastembed",
    "fitz",
    "pymupdf",
    "langchain_core",
    "langfuse",
    "pydantic_settings",
    "pytesseract",
    "qdrant_client",
    "spacy",
    "sqlalchemy",
    "starlette",
    "structlog",
]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
