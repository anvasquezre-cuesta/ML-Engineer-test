[project]
name = "document-intelligence-service"
version = "0.1.0"
description = "ML Engineer take-home — document extraction + RAG service (implement from scratch)."
requires-python = ">=3.12"

# Baseline dependencies — change/pin these as you see fit (justify in DECISIONS.md).
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    # OCR / PDF
    "pytesseract",
    "pymupdf",
    "pillow",
    # NER  (after sync: `uv run python -m spacy download en_core_web_sm`)
    "spacy",
    # Fuzzy matching
    "thefuzz",
    "python-Levenshtein",
    # Embeddings + vector store
    "sentence-transformers",
    "qdrant-client",
    # LLM / HTTP
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
