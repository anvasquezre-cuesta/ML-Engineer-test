<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Document Intelligence Audit Viewer</title>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
    ></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            margin-top: 0;
        }

        .controls {
            background: white;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input[type="file"],
        textarea,
        button {
            font: inherit;
        }

        textarea {
            width: 100%;
            max-width: 700px;
            min-height: 120px;
            box-sizing: border-box;
            padding: 8px;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
        }

        #status {
            margin-top: 12px;
            font-weight: bold;
        }

        #results {
            margin-top: 20px;
        }

        .page-container {
            margin-bottom: 24px;
        }

        .page-title {
            margin-bottom: 8px;
            font-weight: bold;
        }

        .page-wrapper {
            position: relative;
            display: inline-block;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .pdf-page {
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .matches {
            background: white;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .match {
            margin-bottom: 8px;
        }

        .empty {
            color: #666;
        }
    </style>
</head>

<body>
    <h1>Document Intelligence Audit Viewer</h1>

    <div class="controls">
        <div class="field">
            <label for="pdf-file">PDF file</label>
            <input
                id="pdf-file"
                type="file"
                accept="application/pdf,.pdf"
            >
        </div>

        <div class="field">
            <label for="names">
                Candidate names (JSON)
            </label>

            <textarea id="names">[
  {
    "first_name": "Richard",
    "last_name": "Hernandez"
  }
]</textarea>
        </div>

        <button id="extract-button">
            Extract names
        </button>

        <div id="status"></div>
    </div>

    <div id="results"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const pdfFileInput = document.getElementById("pdf-file");
        const namesInput = document.getElementById("names");
        const extractButton = document.getElementById("extract-button");
        const statusElement = document.getElementById("status");
        const resultsElement = document.getElementById("results");

        extractButton.addEventListener("click", extractAndRender);

        async function extractAndRender() {
            const pdfFile = pdfFileInput.files[0];

            if (!pdfFile) {
                setStatus("Please select a PDF file.", true);
                return;
            }

            let names;

            try {
                names = JSON.parse(namesInput.value);

                if (!Array.isArray(names)) {
                    throw new Error("Names must be a JSON list.");
                }
            } catch (error) {
                setStatus(
                    "The candidate names must be valid JSON.",
                    true
                );
                return;
            }

            setStatus("Extracting names...", false);
            resultsElement.innerHTML = "";
            extractButton.disabled = true;

            try {
                const formData = new FormData();

                formData.append("pdf_file", pdfFile);
                formData.append("names", JSON.stringify(names));

                const response = await fetch("/api/extract", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    const errorBody = await response.json()
                        .catch(() => null);

                    const detail = errorBody?.detail
                        || `Extraction failed (${response.status}).`;

                    throw new Error(detail);
                }

                const extractionResult = await response.json();

                setStatus(
                    `Extraction completed: ${
                        extractionResult.extracted_names.length
                    } name(s) detected.`,
                    false
                );

                await renderDocument(
                    pdfFile,
                    extractionResult
                );
            } catch (error) {
                console.error(error);
                setStatus(
                    `Error: ${error.message}`,
                    true
                );
            } finally {
                extractButton.disabled = false;
            }
        }

        async function renderDocument(pdfFile, extractionResult) {
            const pdfBytes = await pdfFile.arrayBuffer();

            const pdf = await pdfjsLib.getDocument({
                data: pdfBytes
            }).promise;

            renderMatches(extractionResult.fuzzy_matches);

            const namesByPage = groupNamesByPage(
                extractionResult.extracted_names
            );

            for (let pageNumber = 0; pageNumber < pdf.numPages; pageNumber++) {
                const page = await pdf.getPage(pageNumber + 1);

                await renderPage(
                    page,
                    pageNumber,
                    namesByPage[pageNumber] || []
                );
            }
        }

        function groupNamesByPage(extractedNames) {
            const namesByPage = {};

            for (const extractedName of extractedNames) {
                const pageNumber =
                    extractedName.bounding_box.page_number;

                if (!namesByPage[pageNumber]) {
                    namesByPage[pageNumber] = [];
                }

                namesByPage[pageNumber].push(extractedName);
            }

            return namesByPage;
        }

        async function renderPage(
            page,
            pageNumber,
            extractedNames
        ) {
            const scale = 1.5;

            const viewport = page.getViewport({
                scale: scale,
                rotation: 0
            });

            const pageContainer =
                document.createElement("div");

            pageContainer.className = "page-container";

            const pageTitle =
                document.createElement("div");

            pageTitle.className = "page-title";
            pageTitle.textContent =
                `Page ${pageNumber + 1}`;

            const pageWrapper =
                document.createElement("div");

            pageWrapper.className = "page-wrapper";

            const canvas =
                document.createElement("canvas");

            canvas.className = "pdf-page";

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            const overlay =
                document.createElement("canvas");

            overlay.className = "overlay";

            overlay.width = viewport.width;
            overlay.height = viewport.height;

            pageWrapper.appendChild(canvas);
            pageWrapper.appendChild(overlay);

            pageContainer.appendChild(pageTitle);
            pageContainer.appendChild(pageWrapper);

            resultsElement.appendChild(pageContainer);

            const context = canvas.getContext("2d");

            await page.render({
                canvasContext: context,
                viewport: viewport
            }).promise;

            drawBoundingBoxes(
                overlay.getContext("2d"),
                extractedNames,
                scale
            );
        }

        function drawBoundingBoxes(
            context,
            extractedNames,
            scale
        ) {
            context.lineWidth = 3;

            for (const extractedName of extractedNames) {
                const box = extractedName.bounding_box;

                const x = box.x * scale;
                const y = box.y * scale;
                const width = box.width * scale;
                const height = box.height * scale;

                context.strokeRect(
                    x,
                    y,
                    width,
                    height
                );

                context.font = "14px Arial";

                const label = extractedName.name;

                const textWidth =
                    context.measureText(label).width;

                context.fillRect(
                    x,
                    Math.max(0, y - 20),
                    textWidth + 8,
                    20
                );

                context.fillText(
                    label,
                    x + 4,
                    Math.max(14, y - 6)
                );
            }
        }

        function renderMatches(matches) {
            if (!matches || matches.length === 0) {
                return;
            }

            const container =
                document.createElement("div");

            container.className = "matches";

            const heading =
                document.createElement("h2");

            heading.textContent = "Fuzzy matches";

            container.appendChild(heading);

            for (const match of matches) {
                const element =
                    document.createElement("div");

                element.className = "match";

                element.textContent =
                    `${match.extracted_name} → ` +
                    `${match.matched_name} ` +
                    `(score: ${match.score.toFixed(2)})`;

                container.appendChild(element);
            }

            resultsElement.appendChild(container);
        }

        function setStatus(message, isError) {
            statusElement.textContent = message;
            statusElement.style.color =
                isError ? "darkred" : "inherit";
        }
    </script>
</body>
</html>
