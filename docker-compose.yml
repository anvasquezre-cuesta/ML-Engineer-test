services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    # The named volume is created root-owned; the image's own user cannot write it.
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: ["server", "-s3", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: docintel-local
      AWS_SECRET_ACCESS_KEY: docintel-local-secret
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      # "localhost" resolves to IPv6 in this image; the gateway listens on IPv4.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.47
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until echo "s3.bucket.create -name docintel"
        | weed shell -master=seaweedfs:9333; do sleep 1; done
    restart: "no"

volumes:
  qdrant_data:
  dynamodb_data:
  seaweedfs_data:
  rabbitmq_data:
