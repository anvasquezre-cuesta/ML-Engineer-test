x-app: &app
  build:
    context: .
    dockerfile: containers/app.Dockerfile
    target: runtime
  image: docintel-app:local
  # Credentials for the language model; every other setting has a default.
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DOCINTEL_QDRANT__URL: http://qdrant:6333
    DOCINTEL_DYNAMODB__ENDPOINT_URL: http://dynamodb:8000
    DOCINTEL_DYNAMODB__ACCESS_KEY_ID: local
    DOCINTEL_DYNAMODB__SECRET_ACCESS_KEY: local
    DOCINTEL_BLOB__ENDPOINT_URL: http://seaweedfs:8333
    DOCINTEL_BLOB__ACCESS_KEY_ID: docintel-local
    DOCINTEL_BLOB__SECRET_ACCESS_KEY: docintel-local-secret
    DOCINTEL_QUEUE__RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  restart: unless-stopped

services:
  api:
    <<: *app
    environment:
      <<: *app-env
      # Only the api creates the tables, so two processes never race to.
      DOCINTEL_DYNAMODB__CREATE_TABLES: "true"
    ports:
      - "8080:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "app.worker_main"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: containers/frontend.Dockerfile
    image: docintel-frontend:local
    ports:
      - "8081:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 3s
      timeout: 3s
      retries: 20

  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    # The named volume is created root-owned; the image's own user cannot write it.
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    healthcheck:
      # Any HTTP answer means the server is up; unsigned requests get a 400.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:8000"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: ["server", "-s3", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: docintel-local
      AWS_SECRET_ACCESS_KEY: docintel-local-secret
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      # "localhost" resolves to IPv6 in this image; the gateway listens on IPv4.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.47
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until echo "s3.bucket.create -name docintel"
        | weed shell -master=seaweedfs:9333; do sleep 1; done
    restart: "no"

volumes:
  qdrant_data:
  dynamodb_data:
  seaweedfs_data:
  rabbitmq_data:
